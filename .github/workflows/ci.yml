name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: NotchCore · Linux
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v5
      - name: Тесты NotchCore
        run: swift test

  app-macos:
    name: Приложение · macOS 27
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Версии
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Тесты NotchCore
        run: swift test
      - name: Сборка .app
        run: scripts/build-app.sh
      - name: Снимки состояний
        run: scripts/screenshots.sh
      - name: Загрузить снимки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore
